name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/checkout@v3
        with:
          node-version: 16

      - name: Install Dependencies
        run: npm install

      - name: Run tests
        run: npm test
